<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trajectoids</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%237b1e30'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="viewport"></div>

    <h1 class="title">trajectoids</h1>

    <details class="info">
      <summary class="round" aria-label="About">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="2.3" /><rect x="10.25" y="9.5" width="3.5" height="11" rx="1.5" /></svg>
      </summary>
      <p>
        A trajectoid is a shape that is carved to follow a specific path. Try drawing a path and watch a unique
        trajectoid form that follows it! To learn more, check out
        <a href="https://doi.org/10.1038/s41586-023-06306-y" target="_blank" rel="noopener">this paper</a>.
      </p>
    </details>

    <nav class="controls">
      <button id="draw-button" class="pill primary">Draw</button>
      <button id="play-button" class="round" aria-label="Pause"></button>
    </nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
